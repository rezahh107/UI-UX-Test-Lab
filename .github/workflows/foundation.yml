name: Foundation verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (verified immutable commit)
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Show executed checkout identity
        run: git rev-parse HEAD
      - name: Verify repository foundation
        run: python3 scripts/verify_foundation.py
      - name: Regression tests for foundation verifier
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
